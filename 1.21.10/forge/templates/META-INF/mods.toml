# mods.toml template for Forge (both the ForgeGradle 6 and 7 toolchain eras).
modLoader="javafml"
loaderVersion="${loaderRange}"
license="All Rights Reserved"
# Client-only mod: Forge sets displayTest to IGNORE_ALL_VERSION and skips
# loading this mod on dedicated servers.
clientSideOnly=true
# Explicit AT declaration (the default path is auto-detected too, this avoids
# a silent miss).
accessTransformers = [ "META-INF/accesstransformer.cfg" ]

[[mods]]
modId="bundleinventory"
version="${version}"
displayName="Bundle Inventory"
authors="Socolio"
description='''Adds interactive inventory to Bundle item'''

[[dependencies.bundleinventory]]
modId="forge"
mandatory=true
versionRange="${loaderRange}"
ordering="NONE"
side="CLIENT"

[[dependencies.bundleinventory]]
modId="minecraft"
mandatory=true
versionRange="${minecraft}"
ordering="NONE"
side="CLIENT"
