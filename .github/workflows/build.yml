name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: '26.2'
            compat: '26.2'
            fabric_api: '0.161.0+26.2'
            cloth: '26.2.155'
            modmenu: '20.0.3'
          - mc: '26.3'
            compat: '26.3'
            fabric_api: '0.162.0+26.3'
            cloth: '26.3.159'
            modmenu: '21.0.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build (MC ${{ matrix.mc }})
        run: >-
          ./gradlew build --no-daemon
          -Pminecraft_version=${{ matrix.mc }}
          -Pmc_compat=${{ matrix.compat }}
          -Pfabric_api_version=${{ matrix.fabric_api }}
          -Pcloth_config_version=${{ matrix.cloth }}
          -Pmodmenu_version=${{ matrix.modmenu }}

      - name: Upload jar (MC ${{ matrix.mc }})
        uses: actions/upload-artifact@v4
        with:
          name: bundleinventory-mc${{ matrix.mc }}
          path: build/libs/*.jar
          if-no-files-found: error
