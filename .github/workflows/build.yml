name: build

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'gradle.properties'
      - 'stonecutter.properties.toml'
      - 'settings.gradle'
      - 'stonecutter.gradle'
      - 'fabric.build.gradle'
      - 'neoforge.build.gradle'
      - 'forge-fg6.build.gradle'
      - 'forge-fg7.build.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/build.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      node:
        description: 'Single group to build (e.g. 26.3-fabric, 1.21.4-neoforge or 26.2-forge). Leave empty for all groups.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"

jobs:
  build:
    name: Every version, both loaders
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Java 25 runs Gradle (Stonecutter 0.10 requires it); Java 21 is only the
      # compile toolchain for the 1.21.x nodes. The last entry becomes JAVA_HOME.
      - name: Set up JDKs 21 and 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Show Java versions
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "JAVA_HOME_21_X64=$JAVA_HOME_21_X64"
          echo "JAVA_HOME_25_X64=$JAVA_HOME_25_X64"

      # setup-gradle caches the Gradle User Home, which is also where the
      # NeoForge nodes cache their NeoForm (decompile) artifacts.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: on-success

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # The first build of a NeoForge node decompiles Minecraft for that
      # version (NeoForm); building projects sequentially keeps that memory
      # usage bounded. Cached afterwards.
      - name: Build (single node)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.node != ''
        run: >
          ./gradlew ":${{ github.event.inputs.node }}:build"
          --no-daemon --no-parallel --stacktrace --console=plain
          -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64

      - name: Build (all nodes)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.node == ''
        run: >
          ./gradlew build
          --no-daemon --no-parallel --stacktrace --console=plain
          -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64

      - name: Verify one jar per node
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.node == ''
        shell: bash
        run: |
          expected=$(find versions -mindepth 1 -maxdepth 1 -type d | wc -l)
          actual=$(find versions -path '*/build/libs/*.jar' \
            ! -name '*-sources.jar' ! -name '*-dev.jar' | wc -l)
          echo "nodes=$expected jars=$actual"
          find versions -path '*/build/libs/*.jar' | sort
          test "$expected" -gt 0
          test "$actual" -ge "$expected" || {
            echo "::error::Expected at least one jar per node"
            exit 1
          }

      - name: Upload all version jars
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.node == ''
        uses: actions/upload-artifact@v7
        with:
          name: bundleinventory-jars
          path: |
            versions/*/build/libs/*.jar
            !versions/*/build/libs/*-sources.jar
            !versions/*/build/libs/*-dev.jar
          if-no-files-found: error
          retention-days: 14
