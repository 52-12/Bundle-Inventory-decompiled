# Conservative profile: one node / one worker at a time so a full-tree build
# never stacks NeoForm, ForgeGradle and Loom setup pipelines in parallel.
# Raise workers or enable parallel later if the machine has headroom.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G
org.gradle.parallel=false
org.gradle.workers.max=1
# Only configure the project(s) whose tasks were requested. Critical here:
# ForgeGradle performs its Minecraft setup at CONFIGURATION time, so without
# this every build would decompile Minecraft for all nine Forge nodes.
org.gradle.configureondemand=true
org.gradle.daemon=true
org.gradle.caching=true
# 15 Loom nodes + 14 ModDev nodes in one build; the configuration cache is not
# stable with these plugin combinations yet.
org.gradle.configuration-cache=false
# Acknowledged: Groovy buildscripts with Stonecutter (Kotlin DSL is preferred,
# but loom-back-compat's dynamic `mappings`/`mod*` configurations and the
# remap-jar task wiring are Groovy-friendly).
dev.kikugie.stonecutter.hard_mode=true
