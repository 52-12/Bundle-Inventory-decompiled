# This file is for Gradle options only; per-version values live in
# stonecutter.properties.toml.

# Large enough for the whole tree: NeoForge nodes run their own NeoForm
# (decompile) pipelines, which are memory-hungry on first use.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G
org.gradle.parallel=true
# 15 Loom nodes + 14 ModDev nodes in one build; the configuration cache is not
# stable with these plugin combinations yet.
org.gradle.configuration-cache=false
# ForgeGradle 6 (the 1.21.6-1.21.10 Forge groups) forks a recompile process
# for its first-run Minecraft setup; give that fork its own heap.
systemProp.net.minecraftforge.gradle.repo.recompile.fork=true
systemProp.net.minecraftforge.gradle.repo.recompile.fork.args=-Xmx4G
# Acknowledged: Groovy buildscripts with Stonecutter (Kotlin DSL is preferred,
# but loom-back-compat's dynamic `mappings`/`mod*` configurations and the
# remap-jar task wiring are Groovy-friendly).
dev.kikugie.stonecutter.hard_mode=true
