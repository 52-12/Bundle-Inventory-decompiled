plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = '1.7.3-port'
group = 'io.socol.bundleinventory'

base {
	archivesName = 'BundleInventory-Fabric'
}

loom {
	accessWidenerPath = file('src/main/resources/bundleinventory.accesswidener')
}

// Version-specific shims. Pick the compat source directory matching the target Minecraft 26.x
// (overridable on the command line / CI with -Pmc_compat=26.3).
def mcCompat = project.findProperty('mc_compat') ?: '26.2'
sourceSets {
	main {
		java.srcDir "src/compat/${mcCompat}"
	}
}

repositories {
	maven {
		name = 'Shedaniel'
		url = 'https://maven.shedaniel.me/'
	}
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
	}
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	// On 26.x Fabric uses Mojang official mappings by default (no `mappings` line).
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional integrations referenced by the mod's source.
	implementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
	implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

	compileOnly 'org.jetbrains:annotations:24.0.1'
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
