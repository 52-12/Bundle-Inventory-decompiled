pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.kikugie.dev/releases'; name = 'KikuGie Releases' }
        maven { url = 'https://maven.kikugie.dev/snapshots'; name = 'KikuGie Snapshots' }
        maven { url = 'https://maven.neoforged.net/releases' }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    // Multi-version, multi-loader build. Each node compiles the decompiled
    // source of the official Bundle Inventory build for that Minecraft
    // version line (see src/versions/<era>). Docs: https://stonecutter.kikugie.dev/
    id 'dev.kikugie.stonecutter' version '0.10'

    // Applies `net.fabricmc.fabric-loom-remap` (obfuscated, <=1.21.11) or
    // `net.fabricmc.fabric-loom` (unobfuscated, >=26.1) per Fabric node.
    // https://codeberg.org/KikuGie/loom-back-compat
    id 'dev.kikugie.loom-back-compat' version '0.4.3'

    // Auto-provision JDKs (Java 21 for 1.21.x nodes, 25 for 26.x nodes).
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// Release groups: the biggest Minecraft span each loader can honestly run
// one jar on, chosen from hard evidence (see README):
//  - the author's own builds span 1.21.2-1.21.3, 1.21.6-1.21.8, 1.21.9-1.21.10;
//  - every member version compiled green against its era source;
//  - a javap diff of every API this mod touches is empty across 26.1-26.1.2.
// 1.21.4 / 1.21.5 / 1.21.11 / 26.2 / 26.3 stay alone: their official sources
// use APIs the neighbouring version does not have.
// Node name -> representative Minecraft version (the lowest member), which
// the jar is compiled against.
def fabricGroups = [
        '1.21.2-1.21.3-fabric': '1.21.2',
        '1.21.4-fabric'       : '1.21.4',
        '1.21.5-fabric'       : '1.21.5',
        '1.21.6-1.21.8-fabric': '1.21.6',
        '1.21.9-1.21.10-fabric': '1.21.9',
        '1.21.11-fabric'      : '1.21.11',
        '26.1-26.1.2-fabric'  : '26.1',
        '26.2-fabric'         : '26.2',
        '26.3-fabric'         : '26.3',
]
def neoforgeGroups = [
        // No 1.21.2 node: NeoForge only ever shipped two abandoned betas for
        // that line.
        '1.21.3-neoforge'       : '1.21.3',
        '1.21.4-neoforge'       : '1.21.4',
        '1.21.5-neoforge'       : '1.21.5',
        '1.21.6-1.21.8-neoforge': '1.21.6',
        '1.21.9-1.21.10-neoforge': '1.21.9',
        '1.21.11-neoforge'      : '1.21.11',
        '26.1-26.1.2-neoforge'  : '26.1',
        '26.2-neoforge'         : '26.2',
        '26.3-neoforge'         : '26.3',
]
// Forge skipped 1.21.2 as well. Every group builds with ForgeGradle 7 —
// the FG6-era MDKs of the 1.21.6-1.21.10 lines target Gradle 8 and cannot
// run in this Gradle 9 build; their userdev configs are schema-identical to
// the FG7-supported neighbours (see research/forge-mdk.md).
def forgeGroups = [
        '1.21.3-forge'       : '1.21.3',
        '1.21.4-forge'       : '1.21.4',
        '1.21.5-forge'       : '1.21.5',
        '1.21.6-1.21.8-forge': '1.21.6',
        '1.21.9-1.21.10-forge': '1.21.9',
        '1.21.11-forge'      : '1.21.11',
        '26.1-26.1.2-forge'  : '26.1',
        '26.2-forge'         : '26.2',
        '26.3-forge'         : '26.3',
]

// NilLoader (Java-agent loader). Only the unobfuscated 26.x line is viable:
// no mapping layer, no resource mounting (the 26.x-era code draws vanilla
// sprites only), and the three mixins are rewritten as Mini transformers.
def nilGroups = [
        '26.1-26.1.2-nil': '26.1',
        '26.2-nil'       : '26.2',
        '26.3-nil'       : '26.3',
]

stonecutter {
    kotlinController = false

    create(rootProject) {
        versions(fabricGroups).buildscript('fabric.build.gradle')
        versions(neoforgeGroups).buildscript('neoforge.build.gradle')
        versions(forgeGroups).buildscript('forge.build.gradle')
        versions(nilGroups).buildscript('nil.build.gradle')
        // The node whose directory state is what lives in git.
        vcsVersion = '26.3-fabric'
    }
}

rootProject.name = 'BundleInventory'
