import java.net.URI
import java.security.MessageDigest
import java.util.zip.ZipFile
import groovy.json.JsonSlurper
import org.objectweb.asm.ClassReader
import org.objectweb.asm.ClassVisitor
import org.objectweb.asm.ClassWriter
import org.objectweb.asm.FieldVisitor
import org.objectweb.asm.Opcodes

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        // Rewrites the game jar for the compile classpath only (see
        // widenGameJar). Runtime widening is done by the nilmod itself.
        classpath 'org.ow2.asm:asm:9.10.1'
    }
}

plugins {
    // NilGradle is not used: 1.5.2 calls ConfigurationContainer.add(...),
    // which Gradle 9 rejects (Configuration method call not allowed). This
    // build reproduces what the official nilmod template does, without the
    // plugin: resolve the Mojang client jar + libraries, widen the client jar
    // for javac, compile, and package NilLoader standalone (embedded agent).
    id 'java'
}

// NilLoader port of the mod, for the unobfuscated 26.x line only:
//  - no mapping layer (the game ships Mojang names),
//  - no mixins (three Mini transformers delegate into the same common Hooks),
//  - no resource mounting (the 26.x-era code draws vanilla sprites only),
//  - no access widener file (runtime transformer + widened compile jar).

// NOTE: Stonecutter manages the project identity; no `group` here.
version = "${property('mod.version')}+mc${property('mod.mc_label')}"
base {
    archivesName = 'BundleInventory-Nil'
}

def eraDir = "${rootDir}/src/versions/${property('sources.dir')}"
def mcVersion = stonecutter.current.version
def javaRelease = 25 // 26.x game classes are major 69: javac must be JDK 25

repositories {
    maven {
        name = 'Sleeping Town'
        url = 'https://repo.sleeping.town'
        content { includeGroup 'com.unascribed' }
    }
    mavenCentral()
}

configurations {
    nilLoader {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

dependencies {
    nilLoader 'com.unascribed:nilloader:1.4.1'
    // NilLoader's API (Mini, ClassTransformer) for compiling the glue.
    compileOnly 'com.unascribed:nilloader:1.4.1'
    compileOnly 'org.jetbrains:annotations:24.0.1'
}

sourceSets {
    main {
        java {
            srcDirs = ["${eraDir}/common/java", "${eraDir}/nil/java"]
            // The SpongePowered mixins are replaced by Mini transformers.
            exclude 'io/socol/bundleinventory/mixin/**'
        }
        resources {
            // No packaging/assets: a nilmod cannot mount a resource pack, and
            // the 26.x-era code uses no mod-provided assets.
            srcDirs = ["${eraDir}/nil/resources"]
        }
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.toVersion(javaRelease)
    targetCompatibility = JavaVersion.toVersion(javaRelease)

    toolchain {
        vendor = JvmVendorSpec.ADOPTIUM
        languageVersion = JavaLanguageVersion.of(javaRelease)
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = javaRelease
}

// ------------------------------------------------------- Mojang artifacts ---
// Resolves the client jar and every library artifact from Mojang's published
// metadata (the same route the launcher and NilGradle use), cached per version
// under build/nil-game/<version>/.

def gameDir = layout.buildDirectory.dir("nil-game/${mcVersion}")
def rawClientJar = gameDir.map { it.file('client.jar') }
def libDir = gameDir.map { it.dir('lib') }

def resolveGame = tasks.register('resolveGame') {
    outputs.file(rawClientJar)
    outputs.dir(libDir)
    doLast {
        def root = gameDir.get().asFile
        root.mkdirs()
        libDir.get().asFile.mkdirs()

        def slurper = new JsonSlurper()
        def manifestUrl = 'https://piston-meta.mojang.com/mc/game/version_manifest_v2.json'
        def manifest = slurper.parse(URI.create(manifestUrl).toURL())
        def versionEntry = manifest.versions.find { it.id == mcVersion }
        if (versionEntry == null) throw new GradleException("unknown Minecraft version: ${mcVersion}")

        def versionJson = slurper.parse(URI.create(versionEntry.url).toURL())
        def client = versionJson.downloads.client
        def clientFile = rawClientJar.get().asFile
        if (!clientFile.exists()) {
            logger.lifecycle("Downloading Minecraft ${mcVersion} client jar")
            clientFile.withOutputStream { out ->
                URI.create(client.url).toURL().withInputStream { it.transferTo(out) }
            }
        }
        def sha1 = MessageDigest.getInstance('SHA-1').digest(clientFile.bytes).encodeHex().toString()
        if (sha1 != client.sha1) {
            throw new GradleException("client.jar checksum mismatch for ${mcVersion}: ${sha1} != ${client.sha1}")
        }

        versionJson.libraries.each { lib ->
            def artifact = lib.downloads?.artifact
            if (artifact == null) return
            if (artifact.path.startsWith('net/java/jinput') || artifact.path.contains('natives')) return
            def dest = new File(libDir.get().asFile, artifact.path)
            if (dest.exists()) return
            dest.parentFile.mkdirs()
            URI.create(artifact.url).toURL().withInputStream { input ->
                dest.withOutputStream { input.transferTo(it) }
            }
        }
    }
}

// ---------------------------------------------------------------- widening --
// javac checks access against the raw game jar, so the four former access
// widener members are widened in a COPY of the client jar that only the
// compile task sees. Runtime widening is done by AccessWidenerTransformer.

class WidenVisitor extends ClassVisitor {
    static final Map<String, Set<String>> FIELD_TARGETS = [
            'net/minecraft/client/gui/screens/inventory/CreativeModeInventoryScreen$SlotWrapper':
                    ['target:Lnet/minecraft/world/inventory/Slot;'] as Set,
            'net/minecraft/client/gui/screens/inventory/AbstractContainerScreen':
                    ['skipNextRelease:Z'] as Set,
    ] as Map
    static final Set<String> CLASS_TARGETS = [
            'net/minecraft/client/gui/screens/inventory/CreativeModeInventoryScreen$SlotWrapper',
            'net/minecraft/client/gui/screens/inventory/AbstractContainerScreen',
            'net/minecraft/world/inventory/ArmorSlot',
    ] as Set
    // javac reads a nested class's access from the OUTER class's InnerClasses
    // attribute, so the outer class files must be rewritten too.
    static final Set<String> OUTER_CLASSES = [
            'net/minecraft/client/gui/screens/inventory/CreativeModeInventoryScreen',
    ] as Set
    static final Set<String> REWRITE = (CLASS_TARGETS + OUTER_CLASSES) as Set

    String current

    WidenVisitor(ClassVisitor next) {
        super(Opcodes.ASM9, next)
    }

    static int makePublic(int access) {
        return (access & ~(Opcodes.ACC_PRIVATE | Opcodes.ACC_PROTECTED)) | Opcodes.ACC_PUBLIC
    }

    @Override
    void visit(int version, int access, String name, String signature, String superName, String[] interfaces) {
        current = name
        if (CLASS_TARGETS.contains(name)) access = makePublic(access)
        super.visit(version, access, name, signature, superName, interfaces)
    }

    @Override
    void visitInnerClass(String name, String outerName, String innerName, int access) {
        // javac reads access from the InnerClasses attribute, so widen it too.
        if (CLASS_TARGETS.contains(name)) access = makePublic(access)
        super.visitInnerClass(name, outerName, innerName, access)
    }

    @Override
    FieldVisitor visitField(int access, String name, String descriptor, String signature, Object value) {
        def fields = FIELD_TARGETS.get(current)
        if (fields != null && fields.contains(name + ':' + descriptor)) access = makePublic(access)
        return super.visitField(access, name, descriptor, signature, value)
    }
}

def widenedJar = gameDir.map { it.file('client-widened.jar') }
def widenGameJar = tasks.register('widenGameJar') {
    dependsOn resolveGame
    inputs.file(rawClientJar)
    outputs.file(widenedJar)
    doLast {
        File source = rawClientJar.get().asFile
        File dest = widenedJar.get().asFile
        dest.parentFile.mkdirs()
        new ZipFile(source).withCloseable { zipIn ->
            new java.util.zip.ZipOutputStream(new FileOutputStream(dest)).withCloseable { zipOut ->
                zipIn.entries().each { entry ->
                    if (entry.directory) {
                        zipOut.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                        zipOut.closeEntry()
                        return
                    }
                    byte[] bytes = zipIn.getInputStream(entry).bytes
                    if (WidenVisitor.REWRITE.any { entry.name == it + '.class' }) {
                        def reader = new ClassReader(bytes)
                        def writer = new ClassWriter(reader, 0)
                        reader.accept(new WidenVisitor(writer), 0)
                        bytes = writer.toByteArray()
                    }
                    zipOut.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                    zipOut.write(bytes)
                    zipOut.closeEntry()
                }
            }
        }
    }
}

tasks.named('compileJava') {
    dependsOn widenGameJar
    classpath = files(widenedJar) +
            files({ gameDir.get().dir('lib').asFile.listFiles() == null ? [] :
                    fileTree(gameDir.get().dir('lib')) { include '**/*.jar' } }) +
            configurations.compileClasspath
    dependsOn resolveGame
}

// ---------------------------------------------------------------- metadata --
// NilGradle used to expand ${version} in <id>.nilmod.css; do it here.
processResources {
    def props = ['version': project.version.toString()]
    inputs.property('version', props['version'])
    filesMatching('bundleinventory.nilmod.css') {
        expand(props)
    }
}

// ---------------------------------------------------------------- packaging --
// Standalone agent jar: embed NilLoader (its classes are already shaded) and
// the agent manifest entries NilGradle's `standalone true` would set.

tasks.named('jar') {
    manifest {
        attributes(
                'Premain-Class': 'nilloader.NilAgent',
                'Agent-Class': 'nilloader.NilAgent',
                'Can-Retransform-Classes': 'true',
                'Implementation-Title': 'Bundle Inventory (NilLoader)',
                'Implementation-Version': project.version,
        )
    }
    from({ zipTree(configurations.nilLoader.singleFile) }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    }
    from(rootProject.file('LICENSE_BundleInventory-Fabric')) {
        rename { "${it}-bundleinventory" }
    }
}

// Builds the mod jar for the current node and collects it into `build/libs/`.
tasks.register('buildAndCollect', Copy) {
    group = 'build'
    description = 'Builds the nilmod jar and copies it to `build/libs/`'
    dependsOn 'build'
    from(tasks.named('jar').flatMap { it.archiveFile })
    into(rootProject.layout.buildDirectory.dir('libs'))
}
