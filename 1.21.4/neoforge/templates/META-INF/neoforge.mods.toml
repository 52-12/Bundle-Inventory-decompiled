# neoforge.mods.toml template for the 1.21.x line (javafml era).
modLoader="javafml"
loaderVersion="${loaderRange}"
license="All Rights Reserved"

[[mods]]
modId="bundleinventory"
version="${version}"
displayName="Bundle Inventory"
authors="Socolio"
description='''Adds interactive inventory to Bundle item'''
# Client-only mod: do not version-check it against the server.
displayTest="IGNORE_ALL_VERSION"

[[mixins]]
config="bundleinventory.client.mixins.json"

[[dependencies.bundleinventory]]
modId="neoforge"
type="required"
versionRange="${neoRange}"
ordering="NONE"
side="CLIENT"

[[dependencies.bundleinventory]]
modId="minecraft"
type="required"
versionRange="${minecraft}"
ordering="NONE"
side="CLIENT"
