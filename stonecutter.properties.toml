# Centralized mod + per-node properties.
# See https://stonecutter.kikugie.dev/wiki/v2/reference/gradle-api/structured-properties
#
# One node per RELEASE GROUP (the biggest Minecraft span each loader can
# honestly run one jar on; the group's jar is compiled against its lowest
# member, `stonecutter.current.version`). "mod.version" is the original mod
# version of the official build the era decompiles, so the jar reports honest
# provenance, e.g. BundleInventory-Fabric-1.7.2+mc1.21.6-1.21.8.jar.

mod.id = "bundleinventory"
mod.name = "Bundle Inventory"

# Fabric Loader is version-agnostic; one version for every Fabric node.
deps.fabric_loader = "0.20.1"

# Loom plugin version shared by both loom variants.
loomx.loom_version = "1.19.4"

# ---------------------------------------------------------------- fabric ----

["1.21.2-1.21.3-fabric"]
# Official build: Bundle Inventory 1.6.0 (mc 1.21.2-1.21.3). The author's own
# jar covered both versions.
sources.dir = "1.21.2-1.21.3"
mod.version = "1.6.0"
mod.mc_label = "1.21.2-1.21.3"
mod.mc_compat = ">=1.21.2 <1.21.4"
java.release = "21"
deps.cloth_config = "16.0.143"
deps.modmenu = "12.0.1"
# Fabric API modules the official build bundled jar-in-jar: Fabric
# Loader has no resource-pack support, these mount the mod assets.
deps.fabric_api_base = "0.4.48+c47b9d4373"
deps.fabric_resource_loader = "3.0.5+c47b9d4373"
deps.fabric_resource_loader_v1 = ""

