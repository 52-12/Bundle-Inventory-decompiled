# Centralized mod + per-node properties.
# See https://stonecutter.kikugie.dev/wiki/v2/reference/gradle-api/structured-properties
#
# Node naming: <minecraft>-<loader>. Each node points at the decompiled
# sources of the official Bundle Inventory build for its version line
# (src/versions/<era>). "mod.version" is the original mod version of that
# official build, so the jar we produce reports honest provenance.

mod.id = "bundleinventory"
mod.name = "Bundle Inventory"

# Fabric Loader is version-agnostic; one version for every Fabric node.
deps.fabric_loader = "0.20.1"

# Loom plugin version shared by both loom variants.
loomx.loom_version = "1.19.4"

# ---------------------------------------------------------------- fabric ----

